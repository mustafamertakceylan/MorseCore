name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  checks:
    uses: ./.github/workflows/build.yml
    with:
      release-tag: ${{ github.ref_name }}

  publish:
    name: Publish tested desktop packages
    needs: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Download package from this run
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: MorseCore-Windows-x64
          path: packages/windows

      - name: Download tested Mac package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: MorseCore-macOS-arm64
          path: packages/macos

      - name: Download tested Linux packages
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: MorseCore-Linux-x64
          path: packages/linux

      - name: Verify exact release assets and prepare manifests
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python3 - <<'PY'
          import hashlib
          import os
          from pathlib import Path
          import re
          import shutil

          tag = os.environ['RELEASE_TAG']
          if not re.fullmatch(r'v(?:0|[1-9]\d*)\.(?:0|[1-9]\d*)\.(?:0|[1-9]\d*)', tag):
              raise SystemExit('Expected a stable vMAJOR.MINOR.PATCH release tag')
          version = tag[1:]
          prefix = f'MorseCore-{version}'
          windows = [f'{prefix}-Windows-x64-Desktop.zip', f'{prefix}-Windows-x64-Setup.exe']
          macos = [f'{prefix}-macOS-arm64.dmg']
          linux = [f'{prefix}-Linux-x64.tar.gz', f'{prefix}-Linux-x64.deb']
          linux_sums = 'SHA256SUMS-Linux-x64.txt'
          groups = [
              ('windows', 'SHA256SUMS', windows, ['RELEASE-NOTES.md']),
              ('macos', 'SHA256SUMS-macOS-arm64.txt', macos, []),
              ('linux', linux_sums, linux, ['PKGBUILD']),
          ]
          hashes = {}
          def digest(path):
              with path.open('rb') as stream:
                  return hashlib.file_digest(stream, 'sha256').hexdigest()
          for platform, manifest, expected, extras in groups:
              directory = Path('packages') / platform
              entries = list(directory.iterdir())
              allowed = set(expected + extras + [manifest])
              if {entry.name for entry in entries} != allowed or any(
                  entry.is_symlink() or not entry.is_file() or entry.stat().st_size == 0 for entry in entries
              ):
                  raise SystemExit(f'Unexpected or missing {platform} artifact contents')
              listed = {}
              for line in (directory / manifest).read_text(encoding='utf-8').splitlines():
                  match = re.fullmatch(r'([0-9a-fA-F]{64})  (.+)', line)
                  if match is None or match[2] not in expected or match[2] in listed:
                      raise SystemExit(f'Unexpected, duplicate or unsafe entry in {manifest}')
                  listed[match[2]] = match[1].lower()
              if set(listed) != set(expected):
                  raise SystemExit(f'Incomplete {manifest}')
              for name in expected:
                  actual = digest(directory / name)
                  if actual != listed[name]:
                      raise SystemExit(f'Checksum mismatch: {name}')
                  hashes[name] = actual
          recipe = Path('packages/linux/PKGBUILD').read_text(encoding='utf-8')
          if (re.findall(r'^pkgver=(.+)$', recipe, re.M) != [version]
              or re.findall(r'^source=\(\x27([^\x27]+)\x27\)$', recipe, re.M) != [linux[0]]
              or re.findall(r'^sha256sums=\(\x27([0-9a-f]{64})\x27\)$', recipe, re.M) != [hashes[linux[0]]]):
              raise SystemExit('Arch recipe version, source or checksum differs from the tested Linux archive')
          destination = Path('dist')
          destination.mkdir(exist_ok=False)
          for platform, _, expected, _ in groups:
              for name in expected:
                  shutil.copyfile(Path('packages') / platform / name, destination / name)
          for name in ['PKGBUILD', linux_sums]:
              shutil.copyfile(Path('packages/linux') / name, destination / name)
              hashes[name] = digest(destination / name)
          shutil.copyfile('packages/windows/RELEASE-NOTES.md', destination / 'RELEASE-NOTES.md')
          (destination / 'SHA256SUMS').write_text(
              ''.join(f'{hashes[name]}  {name}\n' for name in sorted(hashes)), encoding='utf-8')
          print(f'Verified Windows, macOS and Linux packages for {tag}; Linux manifest preserved')
          PY
          cd dist
          sha256sum --check --strict SHA256SUMS

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          version="${RELEASE_TAG#v}"
          assets=(
            "dist/MorseCore-$version-Windows-x64-Desktop.zip"
            "dist/MorseCore-$version-Windows-x64-Setup.exe"
            "dist/MorseCore-$version-macOS-arm64.dmg"
            "dist/MorseCore-$version-Linux-x64.tar.gz"
            "dist/MorseCore-$version-Linux-x64.deb"
            dist/PKGBUILD
            dist/SHA256SUMS-Linux-x64.txt
            dist/SHA256SUMS
          )
          gh release create "$RELEASE_TAG" "${assets[@]}" \
            --verify-tag --title "MorseCore $RELEASE_TAG" --notes-file dist/RELEASE-NOTES.md
