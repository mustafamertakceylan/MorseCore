name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  checks:
    uses: ./.github/workflows/build.yml
    with:
      release-tag: ${{ github.ref_name }}

  publish:
    name: Publish tested desktop packages
    needs: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Download package from this run
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: MorseCore-Windows-x64
          path: dist

      - name: Verify package checksums
        working-directory: dist
        run: sha256sum --check --strict SHA256SUMS

      - name: Download tested Mac package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: MorseCore-macOS-arm64
          path: dist

      - name: Verify Mac checksums and merge manifest
        working-directory: dist
        run: |
          sha256sum --check --strict SHA256SUMS-macOS-arm64.txt
          cat SHA256SUMS-macOS-arm64.txt >> SHA256SUMS
          sha256sum --check --strict SHA256SUMS

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: >-
          gh release create "$RELEASE_TAG" dist/*.zip dist/*-Setup.exe dist/*.dmg dist/SHA256SUMS
          --verify-tag --title "MorseCore $RELEASE_TAG" --notes-file dist/RELEASE-NOTES.md
