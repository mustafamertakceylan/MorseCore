name: Build and test

on:
  workflow_call:
    inputs:
      release-tag:
        description: Optional release tag; must equal v plus the CMake project version.
        required: false
        default: ""
        type: string

permissions:
  contents: read

env:
  PYTHONUTF8: "1"

jobs:
  windows:
    name: Windows / GCC UCRT64
    runs-on: windows-2022
    timeout-minutes: 35
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up GCC, CMake, Ninja and Python
        uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e # v2.33.0
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-python
            mingw-w64-ucrt-x86_64-binutils

      - name: Set up .NET 10 for headless interop tests
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: "10.0.x"

      - name: Configure release build
        run: cmake --preset release -DMORSECORE_BUILD_DOTNET_BINDINGS=ON "-DDOTNET_EXECUTABLE=$(cygpath -m "$DOTNET_ROOT/dotnet.exe")" "-DCMAKE_C_FLAGS=-Wall -Wextra -Wpedantic -Wconversion -Werror" -DPython3_EXECUTABLE="$(cygpath -m "$(command -v python)")"

      - name: Verify release tag
        if: inputs.release-tag != ''
        env:
          MORSECORE_RELEASE_TAG: ${{ inputs.release-tag }}
        run: cmake "-DCPACK_CONFIG=cmake-build-release/CPackConfig.cmake" -P scripts/verify_release_tag.cmake

      - name: Build
        run: cmake --build --preset release --parallel 2

      - name: Run all tests without audio hardware
        run: ctest --preset release --no-tests=error --timeout 180

      - name: Build WinUI and shared desktop screens
        shell: pwsh
        working-directory: apps/MorseCore.Desktop
        env:
          DOTNET_CLI_TELEMETRY_OPTOUT: "1"
          DOTNET_GENERATE_ASPNET_CERTIFICATE: "false"
          DOTNET_ADD_GLOBAL_TOOLS_TO_PATH: "false"
          DOTNET_CLI_HOME: ${{ github.workspace }}/cmake-build-interop/dotnet-home
          NUGET_PACKAGES: ${{ github.workspace }}/cmake-build-interop/nuget-packages
        run: |
          dotnet build MorseCore.Desktop/MorseCore.Desktop.csproj -c Release -f net10.0-windows10.0.26100 -p:Platform=x64 "-p:NativeLibraryPath=${{ github.workspace }}/cmake-build-release/MorseCore.Native.dll"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet build MorseCore.Desktop/MorseCore.Desktop.csproj -c Release -f net10.0-desktop -p:Platform=x64 --no-restore "-p:NativeLibraryPath=${{ github.workspace }}/cmake-build-release/MorseCore.Native.dll"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Package desktop ZIP, Setup and runtime notices
        shell: pwsh
        run: |
          ./scripts/package-desktop-installer.ps1 -OutputDirectory "${{ github.workspace }}/dist"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $taskReleaseVersion=[regex]::Match((Get-Content CMakeLists.txt -Raw),'project\(MorseCore VERSION (\d+\.\d+\.\d+)').Groups[1].Value
          Copy-Item -LiteralPath "docs/releases/v$taskReleaseVersion.md" -Destination dist/RELEASE-NOTES.md

      - name: Verify Setup install, reinstall and uninstall
        shell: pwsh
        run: |
          $taskInstaller=@(Get-ChildItem -LiteralPath dist -Filter '*-Setup.exe' -File)
          if ($taskInstaller.Count -ne 1) { throw 'Exactly one desktop installer is required.' }
          ./scripts/test-desktop-installer.ps1 -InstallerPath $taskInstaller[0].FullName -SkipLaunch

      - name: Upload installer check evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: MorseCore-installer-checks
          path: |
            cmake-build-installer-tests/**/installer-checks.json
            cmake-build-installer-tests/**/*.log
          if-no-files-found: ignore
          retention-days: 14

      - name: Package tested console and native library
        run: |
          cpack --config cmake-build-release/CPackConfig.cmake -G ZIP -B dist
          cd dist
          sha256sum -- *.zip *.exe > SHA256SUMS

      - name: Upload Windows packages and checksums
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: MorseCore-Windows-x64
          path: |
            dist/*.zip
            dist/*-Setup.exe
            dist/SHA256SUMS
            dist/RELEASE-NOTES.md
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  linux:
    name: Linux / Clang 18 C23
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y clang-18 cmake ninja-build python3

      - name: Configure release build
        run: cmake --preset release -DCMAKE_C_COMPILER=clang-18 "-DCMAKE_C_FLAGS=-Wall -Wextra -Wpedantic -Wconversion -Werror" -DPython3_EXECUTABLE="$(command -v python3)"

      - name: Verify release tag
        if: inputs.release-tag != ''
        env:
          MORSECORE_RELEASE_TAG: ${{ inputs.release-tag }}
        run: cmake "-DCPACK_CONFIG=cmake-build-release/CPackConfig.cmake" -P scripts/verify_release_tag.cmake

      - name: Build
        run: cmake --build --preset release --parallel 2

      - name: Run all tests without audio hardware
        run: ctest --preset release --no-tests=error --timeout 180
